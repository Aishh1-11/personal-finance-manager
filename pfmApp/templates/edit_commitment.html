
{% extends 'dashboard.html' %}
{% block content %}
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>edit income</title>
</head>
<body>

<div class="container-xxl flex-grow-1 container-p-y">

<div class="col-xl">
                  <div class="card mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Edit Commitment</h5>

  </div>

  <div class="card-body">
    <form action="{% url 'update_commitment' commitment.id %}" method="POST">
        {% csrf_token %}


   <div>
          <div class="mb-3">
        <label class="form-label" for="title">Commitment Title</label>
        <input
          type="text"
          class="form-control"
          id="title"
          name="title"
          value = "{{commitment.title}}"
          required>
      </div>


      <div class="mb-3">
        <label class="form-label" for="amount">Amount</label>
        <input
          type="number"
          class="form-control"
          id="amount"
          name="amount"
          value = "{{commitment.amount}}"

          required>
      </div>


      <div class="mb-3">
        <label class="form-label" for="due_day">Due day of month</label>
        <input
          type="number"
          class="form-control"
          id="due_day"
          name="due_day"
          placeholder="1–31"
          value="{{commitment.due_day}}"
          required>
      </div>




      <div class="mb-3">
        <label class="form-label" for="note">Note (optional)</label>
        <textarea
          rows="3"
          name="note"
          id="note"
          class="form-control"
          >{{commitment.note}}</textarea>
      </div>
   </div>

      <button type="submit" class="btn btn-primary">Update Commitment</button>
    </form>
  </div>
</div>

                </div>

 </div>







</body>
</html>
{% endblock %}
