<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Personal Finance Manager</title>

<link rel="icon" href="{% static 'pfm_admin/img/favicon/favicon.ico' %}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#0f172a,#020617);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Card */
.register-card{
    width:450px;
    background:rgba(15,23,42,0.9);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    position:relative;
}

/* Glow effect */
.register-card::before{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    background:radial-gradient(circle,#6366f1,transparent);
    filter:blur(90px);
    top:-100px;
    left:-100px;
    opacity:0.4;
}

/* Title */
.title{
    color:#fff;
    text-align:center;
    font-size:28px;
    font-weight:600;
    margin-bottom:6px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:28px;
    font-size:14px;
}

/* Input */
.form-group{
    margin-bottom:18px;
}

.form-label{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:6px;
    display:block;
}

.form-control{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #1e293b;
    background:#020617;
    color:white;
    outline:none;
    transition:0.3s;
}

.form-control:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 2px rgba(99,102,241,0.2);
}

/* Button */
.register-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

.register-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(99,102,241,0.4);
}

/* Footer */
.footer{
    text-align:center;
    margin-top:18px;
    color:#94a3b8;
    font-size:14px;
}

.footer a{
    color:#818cf8;
    text-decoration:none;
    font-weight:500;
}

.footer a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="register-card">

    <h2 class="title">Create Account</h2>
    <p class="subtitle">Start managing your finances smarter</p>

    <form method="POST" action="{% url 'user_registration' %}">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>

        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password1" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="password2" class="form-control" placeholder="Confirm password" required>
        </div>

        <button type="submit" class="register-btn">Create Account</button>

        <div class="footer">
            Already have an account?
            <a href="{% url 'login_page' %}">Login</a>
        </div>

    </form>

</div>

</body>
</html>
