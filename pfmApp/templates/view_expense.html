

{% extends 'dashboard.html' %}
{% block content %}
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>edit income</title>
</head>
<body>






            <div class="container-xxl flex-grow-1 container-p-y">
<div class="card">
                <h5 class="card-header">Expense</h5>
                <div class="table-responsive text-nowrap">
                  <table class="table table-dark">
                    <thead>
                      <tr>
                        <th>Amount</th>
                        <th>Expense title</th>
                        <th>Date</th>
                        <th>category</th>
                        <th>Note</th>
                        <th>Actions</th>

                      </tr>
                    </thead>
                    <tbody class="table-border-bottom-0">
                    {% for i in expense %}
                      <tr>
                          <td>{{i.amount}}</td>
                          <td>{{i.expense_title}}</td>
                          <td>{{i.date}}</td>

                          <td>{{i.category}}</td>
                          <td>{{i.note}}</td>




                          <td >
                              <div class="d-flex " style=" gap: 3px;">

                                  <a href="{% url 'edit_expense' i.id %}" class="btn btn-primary">Edit</a>
                                  <form method="post" action="{% url 'delete_expense' i.id %}">
                                     {% csrf_token %}
                                  <button type="submit" class=" ms-3 btn btn-outline-danger " onclick="return confirm('Are you sure you want to delete this Income?')" >Delete</button>
                                  </form>

                              </div>
                          </td>



                      </tr>
                    {% endfor %}

                    </tbody>
                  </table>

                </div>
              </div>
  </div>





</body>
</html>
{% endblock %}
