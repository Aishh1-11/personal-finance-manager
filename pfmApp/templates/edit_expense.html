
{% extends 'dashboard.html' %}
{% block content %}
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>edit income</title>
</head>
<body>







   <!-- Content -->

            <div class="container-xxl flex-grow-1 container-p-y">

<div class="col-xl">
                  <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                      <h5 class="mb-0">Edit Expense</h5>

                    </div>
                    <div class="card-body">
                      <form method="post" action = "{% url 'update_expense' expense.id %}">
                          {% csrf_token %}
                        <div class="mb-3">
                          <label class="form-label" for="amount">Expense Amount</label>
                          <input type="number" class="form-control" id="amount" value="{{expense.amount}}" name="amount">
                        </div>


                        <div class="mb-3">
                          <label class="form-label" for="date">Date</label>
                          <input type="date" id="date" class="form-control phone-mask"  value="{{ expense.date|date:'Y-m-d' }}" name="date" max="{{ today }}">
                        </div>

                          <div class="mb-3">
                          <label class="form-label" for="source">Expense title</label>
                          <input type="text" id="source" class="form-control phone-mask"  value="{{expense.expense_title}}" name="title">
                        </div>

               <div class="mb-3">
    <label class="form-label" for="category">Category</label>
    <select class="form-control" id="category" name="category"  {% if expense.category == "commitment" %} disabled {% endif %} >

        {% for value, display in expense.EXPENSE_CATEGORIES %}
                   {% if value != "commitment" %}
            <option value="{{ value }}"
                {% if expense.category == value %} selected {% endif %}
            >
                {{ display }}
            </option>
                   {% endif %}
        {% endfor %}
    </select>

    <!-- Hidden input ensures the value is submitted even if select is disabled -->
                   {% if expense.category == "commitment" %}
    <input type="hidden" name="category" value="{{ expense.category }}">
                   {% endif %}
</div>

                              <div class="mb-3">
                          <label class="form-label" for="source">Note</label>
                          <textarea rows="3" name="note"    class="form-control phone-mask" > {{expense.Note}}</textarea>
                        </div>


                        <button type="submit" class="btn btn-primary">Update</button>
                      </form>
                    </div>
                  </div>
                </div>

  </div>




</body>
</html>
{% endblock %}
