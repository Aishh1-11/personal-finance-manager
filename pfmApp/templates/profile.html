{% extends 'dashboard.html'%}
{% block content %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>profile</title>
</head>
<body>

<div class="col-xl">
                  <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                      <h5 class="mb-0">{{ user.username }}'s Profile</h5>

                    </div>
                    <div class="card-body">
                      <form method="post" action = "{% url 'profile_page' %}" enctype="multipart/form-data">
                          {% csrf_token %}

                          {% if profile.profile_photo %}
                          <img src="{{ profile.profile_photo.url }}" class="img-thumbnail rounded-circle" alt="profile picture" width="100px">
                          {% endif %}

                          <div class="mb-3">
                          <label class="form-label" for="image">Profile Image</label>
                          <input type="file" id="image" class="form-control phone-mask" placeholder="image" name="image">
                        </div>




                        <div class="mb-3">
                          <label class="form-label" for="phone">Phone number</label>
                          <input type="number" id="phone" class="form-control text-white" name="phone" value="{{ profile.phone }}" >
                        </div>





                        <button type="submit" class="btn btn-primary">Submit</button>
                      </form>
                    </div>
                  </div>
                </div>

</body>
</html>

{% endblock %}
