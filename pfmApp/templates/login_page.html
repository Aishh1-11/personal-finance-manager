<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Personal Finance Manager</title>

<link rel="icon" href="{% static 'pfm_admin/img/favicon/favicon.ico' %}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#0f172a,#020617);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Card */
.login-card{
    width:420px;
    background:rgba(15,23,42,0.85);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:18px;
    padding:40px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* Title */
.login-title{
    color:#fff;
    text-align:center;
    font-size:28px;
    font-weight:600;
    margin-bottom:8px;
}

.login-subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:30px;
    font-size:14px;
}

/* Input */
.form-group{
    margin-bottom:20px;
}

.form-label{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:6px;
    display:block;
}

.form-control{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid #1e293b;
    background:#020617;
    color:white;
    outline:none;
    transition:0.3s;
}

.form-control:focus{
    border-color:#6366f1;
    box-shadow:0 0 0 2px rgba(99,102,241,0.2);
}

/* Button */
.login-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 25px rgba(99,102,241,0.4);
}

/* Footer */
.login-footer{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
    font-size:14px;
}

.login-footer a{
    color:#818cf8;
    text-decoration:none;
    font-weight:500;
}

.login-footer a:hover{
    text-decoration:underline;
}

/* Glow effect */
.login-card::before{
    content:"";
    position:absolute;
    width:200px;
    height:200px;
    background:radial-gradient(circle,#6366f1,transparent);
    filter:blur(80px);
    top:-80px;
    left:-80px;
    opacity:0.4;
}
</style>
</head>

<body>

<div class="login-card">

    <h2 class="login-title">Welcome Back</h2>
    <p class="login-subtitle">Login to your Personal Finance Manager</p>

    <form method="post" action="{% url 'user_login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>

        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <div class="login-footer">
            Don't have an account?
            <a href="{% url 'user_registration_page' %}">Create one</a>
        </div>

    </form>

</div>

</body>
</html>
